name: build

# EOS Mail 闭源商业软件：源码在私有仓 eosaios/eos-mail（Tauri v2 / Rust），
# 本公开仓承载多平台构建与问题反馈，beta 期间安装包直接发本仓 Releases
# （与 EOS Todo / EOS Media 同模式）。私有仓访问：EOS_MAIL_DEPLOY_KEY
# （只读 deploy key）。workflow_dispatch 构建只出 artifacts 供内部验证，
# 不建 Release；推 v* tag 触发的构建完成后自动创建带 SHA256SUMS 的公开
# Release。构建的是基础版：不含 Pro 组合（AI 助手 / 账号体系）。
# 注意：私有仓自身的 ci.yml 带 repository.private 护栏休眠，本仓的
# 测试门禁是 main 源码唯一的 CI 回归拦截（同 EOS Todo 模式）。

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag of eosaios/eos-mail to build'
        required: true
        default: 'main'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试门禁（私有仓 main 源码）
    # main / PR / 手动 / tag 都跑：克隆私有仓 main 做格式 + clippy +
    # 全量 Rust 测试 + 前端 lint/typecheck/测试/扫描，是最快的一道回归拦截。
    runs-on: ubuntu-24.04
    steps:
      - name: Set up SSH for private source checkout
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EOS_MAIL_DEPLOY_KEY }}

      - name: Clone private source（main）
        run: git clone --depth 1 --branch main git@github.com:eosaios/eos-mail.git app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install Linux build deps（Tauri v2 / webkit2gtk-4.1）
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: cargo fmt
        working-directory: app
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: app
        env:
          RUSTFLAGS: '-D warnings'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: app
        run: cargo test --workspace

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: 安装前端依赖
        working-directory: app/ui
        run: npm ci

      - name: 前端 lint + typecheck
        working-directory: app/ui
        run: |
          npm run lint
          npm run typecheck

      - name: 前端测试
        working-directory: app/ui
        run: npm test

      - name: token / i18n 扫描
        working-directory: app/ui
        run: |
          npm run scan:tokens
          npm run scan:i18n

  build:
    name: ${{ matrix.platform }}
    # tag 发布与手动构建才跑平台打包；main/PR 只跑上面的 test job。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up SSH for private source checkout
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EOS_MAIL_DEPLOY_KEY }}

      - name: Determine source ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REF=${{ inputs.ref }}" >> "$GITHUB_ENV"
          else
            echo "REF=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Clone private source
        run: git clone --depth 1 --branch "$env:REF" git@github.com:eosaios/eos-mail.git app
        if: runner.os == 'Windows'
      - name: Clone private source
        run: git clone --depth 1 --branch "$REF" git@github.com:eosaios/eos-mail.git app
        if: runner.os != 'Windows'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets（macOS universal）
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install Linux build deps（Tauri v2 / webkit2gtk-4.1）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # 版本号从 tag 注入 tauri.conf.json（安装包命名与元数据的唯一版本源）。
      # NSIS 的 PE 版本资源如不接受预发布后缀，在此步按平台另行兜底。
      - name: Stamp version from tag
        if: startsWith(env.REF, 'v')
        shell: bash
        working-directory: app
        run: |
          VER="${REF#v}"
          echo "app version: $VER"
          sed -i.bak -E 's/^(  "version": )"[^"]*"/\1"'"$VER"'"/' src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak
          grep '"version"' src-tauri/tauri.conf.json | head -2

      - name: 安装前端依赖
        working-directory: app/ui
        run: npm ci

      - name: Build frontend + bundle（Windows NSIS）
        if: runner.os == 'Windows'
        working-directory: app
        shell: bash
        run: tauri build --bundles nsis

      - name: Build frontend + bundle（macOS universal dmg）
        if: runner.os == 'macOS'
        working-directory: app
        run: tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Build frontend + bundle（Linux deb + AppImage）
        if: runner.os == 'Linux'
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: tauri build --bundles deb,appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eos-mail-${{ matrix.platform }}-${{ env.REF }}
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/target/release/bundle/deb/*.deb
            app/target/release/bundle/appimage/*.AppImage
          retention-days: 90
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eos-mail-*
          merge-multiple: true

      # upload-artifact 保留相对路径（release/bundle/...、universal-apple-darwin/...），
      # 先摊平成单层再算校验和，避免 sha256sum 撞目录。
      - name: Flatten assets + Generate SHA256SUMS
        run: |
          mkdir -p flat
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} flat/ \;
          cd flat
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" flat/* \
            --title "EOS Mail $VERSION" \
            --notes "三端安装包（Windows NSIS 安装器 / macOS dmg universal / Linux deb+AppImage），beta 期间免费使用。

          - Windows：NSIS 安装器（未签名，SmartScreen 提示时选择「仍要运行」）
          - macOS：universal dmg（Intel + Apple Silicon），未签名，首次打开如被 Gatekeeper 拦截请执行 \`xattr -cr /Applications/EOS\\ Mail.app\`
          - Linux：deb 与 AppImage
          - 邮件数据存于用户目录（本地 SQLite），卸载不影响已收邮件；凭据只存系统钥匙串
          - 完整性校验见 SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null \
          || gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
