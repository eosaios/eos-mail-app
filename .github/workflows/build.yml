name: Mail complete candidate build
on:
  workflow_dispatch:
    inputs:
      base_ref:
        required: true
      pro_ref:
        required: true
      beta_version:
        required: true
        default: '0.2.0-beta.2'
      dev_version:
        required: true
        default: '0.2.0-dev.1'
      platforms:
        required: true
        default: all
        type: choice
        options: [all, mac-linux, darwin-arm64, windows-amd64, linux-amd64]
      reuse_core_run:
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          SELECTED: ${{ inputs.platforms }}
        run: |
          python - <<'PYMATRIX'
          import json,os
          rows=[dict(os='macos-15',platform='darwin-arm64',core='eos-core-mail'),dict(os='windows-2025',platform='windows-amd64',core='eos-core-mail.exe'),dict(os='ubuntu-24.04',platform='linux-amd64',core='eos-core-mail')]
          selected=os.environ['SELECTED'];assert selected in ['all','mac-linux','darwin-arm64','windows-amd64','linux-amd64']
          rows=[r for r in rows if selected=='all' or r['platform']==selected or (selected=='mac-linux' and r['platform']!='windows-amd64')]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(dict(include=rows))+'\n')
          PYMATRIX
  build:
    needs: plan
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-mail
          ref: ${{ inputs.base_ref }}
          ssh-key: ${{ secrets.EOS_MAIL_DEPLOY_KEY }}
          path: eos-mail
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-mail-pro
          ref: ${{ inputs.pro_ref }}
          ssh-key: ${{ secrets.MAIL_PRO_BUILD_KEY }}
          path: eos-mail-pro
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-core-rs
          ref: d3a967f198a7578e4446820b1b5a2aaf3ce24f79
          ssh-key: ${{ secrets.MAIL_CORE_BUILD_KEY }}
          path: eos-core-rs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Verify native runner architecture
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: python -c "import platform,os; system={'Darwin':'darwin','Windows':'windows','Linux':'linux'}[platform.system()]; arch={'arm64':'arm64','aarch64':'arm64','amd64':'amd64','x86_64':'amd64'}[platform.machine().lower()]; assert system+'-'+arch == os.environ['EXPECTED_PLATFORM']"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libdbus-1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libx11-xcb-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev libpipewire-0.3-dev libdrm-dev libgbm-dev libwayland-dev xvfb xauth patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eos-core-rs
          key: mail-core-d3a967f-${{ matrix.platform }}
          cache-on-failure: true
      - name: Build pinned native Mail core
        if: inputs.reuse_core_run == ''
        working-directory: eos-core-rs
        run: cargo build --release --locked -p eos-core-bin --bin eos-core-mail --features product-mail
      - uses: actions/upload-artifact@v4
        if: inputs.reuse_core_run == ''
        with:
          name: mail-private-core-${{ matrix.platform }}
          path: eos-core-rs/target/release/${{ matrix.core }}
          if-no-files-found: error
      - name: Validate immutable core reuse
        if: inputs.reuse_core_run != ''
        shell: bash
        env:
          CORE_RUN: ${{ inputs.reuse_core_run }}
        run: test "$CORE_RUN" = 39736767555
      - uses: actions/download-artifact@v4
        if: inputs.reuse_core_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_core_run }}
          name: mail-private-core-${{ matrix.platform }}
          path: eos-core-rs/target/release
      - name: Restore native core executable permission
        if: inputs.reuse_core_run != '' && runner.os != 'Windows'
        shell: bash
        run: chmod +x eos-core-rs/target/release/eos-core-mail
      - name: Verify base-only integration contracts
        working-directory: eos-mail
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mail-build/target
        run: cargo test --workspace --no-fail-fast -- --test-threads=1
      - name: Build and verify beta package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mail-build/target
          VERSION: ${{ inputs.beta_version }}
          BUILD_ID: mail-${{ github.run_id }}-${{ github.run_attempt }}
          PLATFORM: ${{ matrix.platform }}
          CORE: ${{ matrix.core }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python eos-mail-pro/scripts/release_candidate.py --base eos-mail --core "eos-core-rs/target/release/$CORE" --version "$VERSION" --channel beta --platform "$PLATFORM" --build-id "$BUILD_ID" --output beta-output --test
          else
            python eos-mail-pro/scripts/release_candidate.py --base eos-mail --core "eos-core-rs/target/release/$CORE" --version "$VERSION" --channel beta --platform "$PLATFORM" --build-id "$BUILD_ID" --output beta-output --test
          fi
      - name: Build and verify macOS development package
        if: runner.os == 'macOS'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mail-build/target
          VERSION: ${{ inputs.dev_version }}
          BUILD_ID: mail-${{ github.run_id }}-${{ github.run_attempt }}
        run: python eos-mail-pro/scripts/release_candidate.py --base eos-mail --core eos-core-rs/target/release/eos-core-mail --version "$VERSION" --channel dev --platform darwin-arm64 --build-id "$BUILD_ID" --output dev-output
      - uses: actions/upload-artifact@v4
        with:
          name: eos-mail-candidate-${{ matrix.platform }}
          path: |
            beta-output/*
            dev-output/*
          if-no-files-found: error
          retention-days: 30
