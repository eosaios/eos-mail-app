name: Compile Mail macOS native icon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-icon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile branded icon with Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p native-output
          xcrun actool brand/Mail.icon --compile native-output --app-icon Mail --enable-on-demand-resources NO --minimum-deployment-target 12.0 --platform macosx --output-partial-info-plist native-output/info.plist
          test -s native-output/Assets.car
          shasum -a 256 native-output/Assets.car > native-output/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mail-native-icon
          path: native-output/
          if-no-files-found: error
